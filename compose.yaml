services:
  main: &main
    image: ghcr.io/yxtay/databricks-container:main
    build:
      cache_from:
        - ghcr.io/yxtay/databricks-container:main
    healthcheck:
      test: [CMD, uv, pip, list]
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true

  "18":
    !!merge <<: *main
    image: ghcr.io/yxtay/databricks-container:18
    build:
      args:
        BASE_IMAGE: public.ecr.aws/ubuntu/ubuntu:24.04
        DATABRICKS_RUNTIME_VERSION: 18
        JDK_VERSION: 21
        PYSPARK_VERSION: 4.1.0
        PYTHON_VERSION: 3.12
        UV_EXCLUDE_NEWER: 2026-06-10
      cache_from:
        - ghcr.io/yxtay/databricks-container:18

  "17_3":
    !!merge <<: *main
    image: ghcr.io/yxtay/databricks-container:17.3
    build:
      args:
        BASE_IMAGE: public.ecr.aws/ubuntu/ubuntu:24.04
        DATABRICKS_RUNTIME_VERSION: 17.3
        JDK_VERSION: 17
        PYSPARK_VERSION: 4.0.0
        PYTHON_VERSION: 3.12
        UV_EXCLUDE_NEWER: 2025-10-22
      cache_from:
        - ghcr.io/yxtay/databricks-container:17.3

  "16_4":
    !!merge <<: *main
    image: ghcr.io/yxtay/databricks-container:16.4
    build:
      args:
        BASE_IMAGE: public.ecr.aws/ubuntu/ubuntu:24.04
        DATABRICKS_RUNTIME_VERSION: 16.4
        JDK_VERSION: 17
        PYSPARK_VERSION: 3.5.2
        PYTHON_VERSION: 3.12
        UV_EXCLUDE_NEWER: 2025-05-09
      cache_from:
        - ghcr.io/yxtay/databricks-container:16.4

  "15_4":
    !!merge <<: *main
    image: ghcr.io/yxtay/databricks-container:15.4
    build:
      args:
        BASE_IMAGE: public.ecr.aws/ubuntu/ubuntu:22.04
        DATABRICKS_RUNTIME_VERSION: 15.4
        JDK_VERSION: 8
        PYSPARK_VERSION: 3.5.0
        PYTHON_VERSION: 3.11
        UV_EXCLUDE_NEWER: 2024-08-19
      cache_from:
        - ghcr.io/yxtay/databricks-container:15.4

  "14_3":
    !!merge <<: *main
    image: ghcr.io/yxtay/databricks-container:14.3
    build:
      args:
        BASE_IMAGE: public.ecr.aws/ubuntu/ubuntu:22.04
        DATABRICKS_RUNTIME_VERSION: 14.3
        JDK_VERSION: 8
        PYSPARK_VERSION: 3.5.0
        PYTHON_VERSION: "3.10"
        UV_EXCLUDE_NEWER: 2024-02-01
      cache_from:
        - ghcr.io/yxtay/databricks-container:14.3
